<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK Terminal — Настройки уведомлений</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="spark-settings-page">
      
      <div class="settings-header">
        <h2 class="settings-title">УВЕДОМЛЕНИЯ</h2>
        <p class="settings-subtitle">Настройте частоту сигналов с орбиты. Обещаем не спамить лишней космической пылью.</p>
      </div>

      <div class="settings-list">
        
        <div class="settings-item">
          <div class="item-info">
            <h3 class="item-label">Звуки интерфейса</h3>
            <p class="item-description">Акустические сигналы терминала при кликах и переходах.</p>
          </div>
          <div class="item-action">
            <label class="spark-toggle">
              <input type="checkbox" id="toggle-sounds" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-item">
          <div class="item-info">
            <h3 class="item-label">Важные анонсы</h3>
            <p class="item-description">Письма о ключевых обновлениях платформы на привязанный email.</p>
          </div>
          <div class="item-action">
            <label class="spark-toggle">
              <input type="checkbox" id="toggle-email">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

      </div>
    </div>

</body>
</html>
