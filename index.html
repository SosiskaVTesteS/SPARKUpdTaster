 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SPARK | Share Card Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="test-area">
        <button class="test-btn" onclick="openShare()">
            <img src="https://img.icons8.com/ios-filled/50/e8c55a/sent.png" width="18">
            Проверить дизайн Share-карточки
        </button>
    </div>

    <div id="shareModal" class="share-overlay" onclick="closeShare()">
        <div class="share-card" onclick="event.stopPropagation()">
            <div class="inner-glow"></div>
            
            <div class="share-content">
                <div class="card-header">
                    <div class="brand">
                        <span class="logo-text">SPARK</span>
                        <span class="slogan">Light Up The Future</span>
                    </div>
                </div>
                
                <h2 class="idea-title">Rooftop Solar Leasing</h2>
                
                <div class="author-block">
                    <div class="avatar">M</div>
                    <div class="author-info">
                        <span class="label">Автор искры:</span>
                        <span class="nick">@maria_builds</span>
                    </div>
                </div>

                <p class="idea-desc">Zero upfront cost. Revenue from grid surplus. 15% bill reduction.</p>
                
                <div class="card-footer">
                    <div class="stats">
                        <p>Инвесторов: <span>184</span></p>
                        <p>Пул: <span>7,200 SPK</span></p>
                    </div>
                    <div class="qr-wrapper">
                        <img id="qrImg" src="" alt="QR">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
