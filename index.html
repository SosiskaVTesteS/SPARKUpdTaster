<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK | Observatory v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="spaceDimmer" class="space-dimmer"></div>

    <div class="galaxy-container">

        <div class="system-wrapper sys-1">
            <div class="cosmic-system" onclick="toggleSystem(this)">
                <div class="central-star star-gold"></div>
                <h3 class="system-title">Технологии</h3>
                <div class="orbit orbit-1"><div class="planet mint"><div class="planet-data"><span class="p-name">AI / ML</span><span class="p-val">12k SPK</span></div></div></div>
                <div class="orbit orbit-2"><div class="planet azure"><div class="planet-data"><span class="p-name">Cloud</span><span class="p-val">8k SPK</span></div></div></div>
            </div>
        </div>

        <div class="system-wrapper sys-2">
            <div class="cosmic-system" onclick="toggleSystem(this)">
                <div class="central-star star-gold"></div>
                <h3 class="system-title">Экология</h3>
                <div class="orbit orbit-1"><div class="planet mint"><div class="planet-data"><span class="p-name">Solar</span><span class="p-val">9k SPK</span></div></div></div>
                <div class="orbit orbit-2"><div class="planet azure"><div class="planet-data"><span class="p-name">Recycle</span><span class="p-val">4k SPK</span></div></div></div>
            </div>
        </div>

        <div class="system-wrapper sys-3">
            <div class="cosmic-system" onclick="toggleSystem(this)">
                <div class="central-star star-gold"></div>
                <h3 class="system-title">Социум</h3>
                <div class="orbit orbit-1"><div class="planet mint"><div class="planet-data"><span class="p-name">Education</span><span class="p-val">7k SPK</span></div></div></div>
                <div class="orbit orbit-2"><div class="planet azure"><div class="planet-data"><span class="p-name">Charity</span><span class="p-val">3k SPK</span></div></div></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

        <div class="cosmic-system system-eco" onclick="toggleSystem(this)">
            <div class="central-star star-secondary"></div>
            <h3 class="system-title">Инновации</h3>
            
            <div class="orbit orbit-1">
                <div class="planet p-left mint">
                    <div class="planet-data">
                        <span class="p-name">Зеленая энергия</span>
                        <span class="p-val">9,800 SPK</span>
                    </div>
                </div>
            </div>

            <div class="orbit orbit-2">
                <div class="planet p-bottom azure">
                    <div class="planet-data">
                        <span class="p-name">Zero Waste</span>
                        <span class="p-val">4,300 SPK</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
            <div class="orbit orbit-3">
                <div class="planet p-bottom tech-planet">
                    <div class="planet-data">
                        <span class="p-name">Web 3.0</span>
                        <span class="p-val">5,200 SPK</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="cosmic-system" onclick="toggleSystem(this)">
            <div class="central-star eco-star"></div>
            <h3 class="system-title eco-text">Эко-Инновации</h3>
            
            <div class="orbit orbit-1">
                <div class="planet p-left eco-planet">
                    <div class="planet-data">
                        <span class="p-name">Солнечные панели</span>
                        <span class="p-val">9,800 SPK</span>
                    </div>
                </div>
            </div>

            <div class="orbit orbit-2">
                <div class="planet p-bottom eco-planet-dark">
                    <div class="planet-data">
                        <span class="p-name">Переработка пластика</span>
                        <span class="p-val">4,300 SPK</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
