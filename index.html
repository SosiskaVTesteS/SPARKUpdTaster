<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARK — Настройки профиля</title>
  <link rel="stylesheet" href="profile-edit.css">
</head>
<body>

  <!-- ══════════════════════════════════════════
       Звёздный фон (div-оверлей, стилизован CSS)
  ══════════════════════════════════════════════ -->
  <div class="starfield" aria-hidden="true"></div>

  <!-- ══════════════════════════════════════════
       Системная строка (декоративная)
  ══════════════════════════════════════════════ -->
  <div class="sys-bar" aria-hidden="true">
    <span class="sys-bar__id">SPARK_TERMINAL_v3.1</span>
    <span class="sys-bar__status">
      <span class="sys-bar__dot"></span>ONLINE
    </span>
  </div>

  <!-- ══════════════════════════════════════════
       Основной контейнер окна
  ══════════════════════════════════════════════ -->
  <main class="stage" role="main">
    <div class="window" role="dialog" aria-labelledby="window-title">

      <!-- ── ШАПКА ОКНА ───────────────────────── -->
      <header class="window__header">
        <!-- Три декоративные точки (терминальный стиль) -->
        <div class="window__dots" aria-hidden="true">
          <span class="dot dot--close"></span>
          <span class="dot dot--min"></span>
          <span class="dot dot--max"></span>
        </div>

        <div class="window__title-group">
          <h1 class="window__title" id="window-title">НАСТРОЙКИ ПРОФИЛЯ</h1>
          <p class="window__subtitle">Конфигурация вашей личности в системе</p>
        </div>

        <!-- Декоративный индекс -->
        <div class="window__index" aria-hidden="true">SYS::USR</div>
      </header>

      <!-- ── ФОРМА ─────────────────────────────── -->
      <form class="profile-form" id="profileForm" novalidate autocomplete="off">

        <!-- БЛОК АВАТАРА ───────────────────────── -->
        <div class="avatar-block">
          <!-- Круглая заглушка аватара -->
          <div class="avatar" id="avatarPreview" aria-label="Предпросмотр аватара">
            <!-- Если аватар не задан — показываем SVG-иконку -->
            <svg class="avatar__icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <circle cx="20" cy="15" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6 36c0-7.732 6.268-14 14-14s14 6.268 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <img class="avatar__img" id="avatarImg" src="" alt="Аватар пользователя" style="display:none;">
            <!-- Оверлей при наведении -->
            <div class="avatar__overlay" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <!-- Никнейм под аватаром -->
          <p class="avatar__username" id="usernameDisplay">искатель_001</p>

          <!-- Мета-строка -->
          <p class="avatar__meta" aria-hidden="true">UID: <span class="accent">0x4F2A</span></p>
        </div>

        <!-- ПОЛЯ ВВОДА ──────────────────────────── -->
        <div class="fields">

          <!-- Аватар (URL) -->
          <div class="field-group" id="fg-avatar">
            <label class="field-group__label" for="inputAvatar">
              <span class="field-group__label-icon" aria-hidden="true">◈</span>
              URL аватара
              <span class="field-group__optional">(необязательно)</span>
            </label>
            <div class="field-group__input-wrap">
              <input
                class="input"
                type="url"
                id="inputAvatar"
                name="avatar"
                placeholder="https://example.com/avatar.png"
                autocomplete="off"
              >
              <span class="field-group__icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                  <path d="M13 7l-6 6M7 7h6v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
            </div>
          </div>

          <!-- Никнейм -->
          <div class="field-group" id="fg-username">
            <label class="field-group__label" for="inputUsername">
              <span class="field-group__label-icon" aria-hidden="true">◈</span>
              Никнейм
              <span class="field-group__required" aria-label="обязательное поле">*</span>
            </label>
            <div class="field-group__input-wrap">
              <input
                class="input"
                type="text"
                id="inputUsername"
                name="username"
                placeholder="your_callsign"
                maxlength="32"
                autocomplete="off"
              >
              <span class="field-group__char-count" id="usernameCount" aria-live="polite">0/32</span>
            </div>
            <p class="field-group__error" id="err-username" role="alert" aria-live="assertive"></p>
          </div>

          <!-- Bio -->
          <div class="field-group" id="fg-bio">
            <label class="field-group__label" for="inputBio">
              <span class="field-group__label-icon" aria-hidden="true">◈</span>
              Bio / Манифест
              <span class="field-group__required" aria-label="обязательное поле">*</span>
            </label>
            <div class="field-group__input-wrap field-group__input-wrap--textarea">
              <textarea
                class="input input--textarea"
                id="inputBio"
                name="bio"
                placeholder="Опишите свою миссию в системе SPARK..."
                maxlength="280"
                rows="4"
              ></textarea>
              <span class="field-group__char-count field-group__char-count--textarea" id="bioCount" aria-live="polite">0/280</span>
            </div>
            <p class="field-group__error" id="err-bio" role="alert" aria-live="assertive"></p>
          </div>

        </div><!-- /.fields -->

        <!-- ── ПОДВАЛ ОКНА ───────────────────────── -->
        <footer class="window__footer">
          <div class="window__footer-info" aria-hidden="true">
            <span class="footer-tag">v2.0</span>
            <span class="footer-tag footer-tag--dim">SPARK::PROFILE</span>
          </div>

          <button class="btn-save" type="submit" id="saveBtn">
            <span class="btn-save__text">Сохранить конфигурацию</span>
            <span class="btn-save__icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
                <path d="M4 10l5 5 7-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
        </footer>

      </form><!-- /.profile-form -->

    </div><!-- /.window -->
  </main>

  <script src="profile-edit.js"></script>
</body>
</html>
