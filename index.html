<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SPARK | Visual Taster</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <div class="main-card-mockup">
        <div class="share-trigger" onclick="openShare()">
            <img src="https://img.icons8.com/ios/50/ffffff/sent.png" width="20">
        </div>
        <p style="color: gray;">Нажми на стрелочку, чтобы проверить Share-окно</p>
    </div>

    <div id="shareModal" class="share-overlay" onclick="closeShare()">
        <div class="share-card" onclick="event.stopPropagation()">
            <div class="inner-glow"></div>
            
            <div class="share-content">
                <div class="card-header">
                    <span class="logo-text">SPARK</span>
                    <span class="version-tag">PHASE ONE</span>
                </div>
                
                <h2 class="idea-title">Rooftop Solar Leasing</h2>
                <p class="idea-desc">Zero upfront cost. Revenue from grid surplus. 15% bill reduction.</p>
                
                <div class="card-footer">
                    <div class="stats">
                        <p>Инвесторов: <span>184</span></p>
                        <p>Пул: <span>7,200 SPK</span></p>
                    </div>
                    <div class="qr-code">
                        <img id="qrImg" src="" alt="QR">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script> </body>
</html>
